# 对外动作契约；source_row 指向 Excel，recipe_id 是演示用参数，不是 Excel 原字段。
# 局部前置条件与完成状态供集中控制判定，分系统内部行为仍由其状态机负责。
version: 1
state_fields:
  main_state:
    type: string
    values:
    - 未就绪
    - 就绪
    - 正常
    - 异常
  business_state:
    type: string
    values:
    - 未就绪
    - 就绪
    - 出光
    - 异常
  current_state:
    type: string
    values:
    - 业务资格失效
    - 关机完成
    - 关机异常
    - 出光失效
    - 出光完成
    - 出光异常
    - 功能检查完成
    - 功能检查异常
    - 参数下发完成
    - 参数下发异常
    - 参数配置失效
    - 复位/待机完成
    - 复位/待机异常
    - 执行超时
    - 故障锁定
    - 未上电/离线
    - 自检完成
    - 自检异常
    - 通信异常
    - 采集完成
    - 采集异常
  task_state:
    type: string
    values:
    - idle
    - executing
    - succeeded
    - failed
    - cancelled
  active_action:
    type: string
    nullable: true
initial_states:
  seed:
    main_state: 未就绪
    current_state: 未上电/离线
    business_state: 未就绪
    task_state: idle
    active_action: null
  shg:
    main_state: 未就绪
    current_state: 未上电/离线
    business_state: 未就绪
    task_state: idle
    active_action: null
contracts:
  seed.power_on_self_test:
    system_type: seed
    action: power_on_self_test
    source_row: 3
    parameters: {}
    precondition:
      all:
      - field: main_state
        in:
        - 未就绪
      - field: current_state
        in:
        - 关机完成
        - 未上电/离线
      - field: active_action
        equals: null
    completion:
      all:
      - field: main_state
        equals: 未就绪
      - field: current_state
        equals: 自检完成
      - field: business_state
        equals: 未就绪
      - field: task_state
        equals: succeeded
      - field: active_action
        equals: null
  seed.function_check:
    system_type: seed
    action: function_check
    source_row: 4
    parameters: {}
    precondition:
      all:
      - field: main_state
        in:
        - 未就绪
        - 正常
        - 异常
      - field: current_state
        in:
        - 自检完成
      - field: active_action
        equals: null
    completion:
      all:
      - field: main_state
        equals: 就绪
      - field: current_state
        equals: 功能检查完成
      - field: business_state
        equals: 就绪
      - field: task_state
        equals: succeeded
      - field: active_action
        equals: null
  seed.parameter_dispatch:
    system_type: seed
    action: parameter_dispatch
    source_row: 5
    parameters:
      recipe_id:
        type: string
        required: false
    precondition:
      all:
      - field: main_state
        in:
        - 就绪
        - 正常
      - field: current_state
        in:
        - 功能检查完成
        - 采集完成
      - field: active_action
        equals: null
    completion:
      all:
      - field: main_state
        equals: 正常
