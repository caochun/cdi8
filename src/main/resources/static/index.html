<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>集中管控 · 流程运行</title>
<link rel="stylesheet" href="vendor/assets/diagram-js.css"><link rel="stylesheet" href="vendor/assets/bpmn-js.css"><link rel="stylesheet" href="vendor/assets/bpmn-font/css/bpmn.css"><link rel="stylesheet" href="style.css">
<script defer src="vendor/bpmn-viewer.js"></script><script defer src="app.js"></script></head>
<body><header><div><span class="eyebrow">CDI8 / WORKFLOW CONTROL</span><h1>集中管控 · 流程运行</h1></div><span id="connection" class="badge">正在连接</span></header>
<main><section class="toolbar"><label>流程定义<select id="process"></select></label><fieldset><legend>出光组件</legend><label><input id="seed" type="checkbox" checked> 种子源</label><label><input id="shg" type="checkbox"> 二倍频</label></fieldset><button id="start" class="primary">启动流程</button><button id="stop" disabled>停止流程</button><label class="history">运行记录<select id="runs"><option value="">查看流程定义</option></select></label></section>
<div id="error" role="alert" hidden></div>
<section class="workspace"><div class="diagram-panel"><div class="diagram-heading"><div><span id="outcome" class="badge">流程定义</span><span id="reason"></span></div><label>查看层级 <select id="scope"></select></label><button id="fit">适合窗口</button></div><div id="canvas"></div><div class="legend"><span class="dot active"></span> 执行中 / 等待事件 <span class="dot completed"></span> 已完成 <span class="dot cancelled"></span> 已中断 <span>滚轮缩放 · 拖动平移 · 双击子流程展开</span></div></div><aside><h2>节点详情</h2><div id="details">点击流程节点查看命令及执行记录。</div></aside></section>
<section class="devices-panel"><h2>Tango 设备 <small>订阅 Snapshot 属性变化事件</small></h2><div id="devices" class="devices"></div></section>
<p class="note">停止流程会停止后续编排；设备已接受的动作需在组件端处置。同步与环境条件演示设备初始均不满足，由外部 Tango 操作显式提供。</p></main></body></html>
