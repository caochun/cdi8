phase: 发射阶段
phase_id: 2

stages:
  - id: T01
    name: 发射前并行准备
    steps:
      - name: 诊断设备采集设置
        device: gxlf/diag_system/01
        command: DiagCollectSetup
        timeout: 60
        critical: true
      - name: 晶体位姿设置
        device: gxlf/freq_conversion/01
        command: CrystalPoseAdjust
        timeout: 60
        critical: true
      - name: 发射充电准备
        device: gxlf/pump_laser/01
        command: ChargeReady
        timeout: 60
        critical: true
      - name: 开关充电
        device: gxlf/switch_driver/01
        command: SwitchCharge
        timeout: 120
        critical: true
      - name: 能量精闭环
        device: gxlf/preamplifier/01
        command: EnergyFineLoop
        timeout: 60
        critical: true

  - id: T02
    name: 预放单次配方
    steps:
      - name: 预放单次配方
        device: gxlf/timing_sync/01
        command: ShotReadyRecipe
        timeout: 30
        critical: true

  - id: T03
    name: 测量准备与能量计清零
    steps:
      - name: 打靶测量准备
        device: gxlf/measurement_sample/01
        command: MeasTargetAlignReady
        timeout: 30
        critical: true
      - name: 能量计清零
        device: gxlf/preamplifier/01
        command: EnergyMeterReset
        timeout: 10
        critical: false

  - id: T04
    name: 发射充电
    steps:
      - name: 发射充电
        device: gxlf/pump_laser/01
        command: PumpCharge
        timeout: 90
        critical: true

  - id: T05
    name: 触发发射
    steps:
      - name: 泵浦触发准备
        device: gxlf/pump_laser/01
        command: PumpTriggerReady
        timeout: 10
        critical: true
      - name: 开关触发准备
        device: gxlf/switch_driver/01
        command: SwitchTriggerReady
        timeout: 10
        critical: true
      - name: 同步触发
        device: gxlf/timing_sync/01
        command: SyncTrigger
        timeout: 10
        critical: true
