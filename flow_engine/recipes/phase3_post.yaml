phase: 发射后处理阶段
phase_id: 3

stages:
  - id: T01
    name: 发射后数据并行采集
    steps:
      - name: 种子源激光参数采集
        device: gxlf/seed_source/01
        command: SeedLaserParamCollect
        timeout: 60
        critical: false
      - name: 二倍频激光参数采集
        device: gxlf/shg_injection/01
        command: SHGParamCollect
        timeout: 60
        critical: false
      - name: 能量数据采集
        device: gxlf/preamplifier/01
        command: EnergyDataCollect
        timeout: 30
        critical: false
      - name: 放电波形采集
        device: gxlf/switch_driver/01
        command: DischargeWaveCollect
        timeout: 30
        critical: false
      - name: 激光参数采集
        device: gxlf/measurement_sample/01
        command: LaserParamCollect
        timeout: 60
        critical: false
      - name: 靶瞄收靶
        device: gxlf/target_alignment/01
        command: TargetRetract
        timeout: 120
        critical: false
      - name: 片放吹扫
        device: gxlf/cooling_air/01
        command: SlabPurge
        timeout: 60
        critical: false

  - id: T02
    name: 设备复位
    steps:
      - name: 物理诊断后处理
        device: gxlf/diag_system/01
        command: DiagShotPostProcess
        timeout: 180
        critical: false
      - name: 高压电源退电DIM复位
        device: gxlf/pump_laser/01
        command: HVPowerOff
        timeout: 60
        critical: true

  - id: T03
    name: 数据分析与待机
    steps:
      - name: 预放待机
        device: gxlf/preamplifier/01
        command: PreampStandby
        timeout: 30
        critical: false
      - name: 靶瞄数据分析
        device: gxlf/target_alignment/01
        command: TargetDataAnalysis
        timeout: 120
        critical: false
      - name: 模型参数计算
        device: gxlf/model_calibration/01
        command: ModelParamCalc
        timeout: 300
        critical: false
      - name: 开关待机
        device: gxlf/switch_driver/01
        command: SwitchStandby
        timeout: 30
        critical: false

  - id: T04
    name: 预电离发射准备
    steps:
      - name: 预电离发射准备
        device: gxlf/pump_laser/01
        command: PreIonShotReady
        timeout: 60
        critical: true

  - id: T05
    name: 预电离发射充电
    steps:
      - name: 预电离发射充电
        device: gxlf/pump_laser/01
        command: PreIonCharge
        timeout: 60
        critical: true

  - id: T06
    name: 预电离触发
    steps:
      - name: 泵浦触发准备
        device: gxlf/pump_laser/01
        command: PumpTriggerReady
        timeout: 10
        critical: true
      - name: 同步触发
        device: gxlf/timing_sync/01
        command: SyncTrigger
        timeout: 10
        critical: true

  - id: T07
    name: 泵浦数据采集
    steps:
      - name: 泵浦数据采集
        device: gxlf/pump_laser/01
        command: PumpDataCollect
        timeout: 60
        critical: false

  - id: T08
    name: 本发次收尾
    steps:
      - name: 泵浦待机
        device: gxlf/pump_laser/01
        command: PumpStandby
        timeout: 30
        critical: false
      - name: 退出安全管控状态
        device: gxlf/safety_interlock/01
        command: ExitSafetyControl
        timeout: 30
        critical: true
