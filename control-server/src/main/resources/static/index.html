<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GXLF · Flowable 操作台</title>
<style>body{font:15px system-ui;background:#edf3f6;color:#183745;margin:0}header{background:#153947;color:white;padding:25px 5vw}h1{font-size:24px;margin:0}main{max-width:1250px;margin:auto;padding:22px}section{background:white;padding:20px;border:1px solid #d4e0e7;border-radius:12px;margin:16px 0}button,input{font:inherit;padding:9px;border:1px solid #bfd1db;border-radius:6px;margin:4px}button{cursor:pointer;background:#eef6f7}button:disabled{opacity:.5}table{width:100%;border-collapse:collapse;font-size:13px}td,th{border-bottom:1px solid #e1e9ee;padding:9px;text-align:left}#error{color:#af253c}small{color:#69828c}.scroll{overflow:auto}pre{white-space:pre-wrap;overflow-wrap:anywhere}</style>
<header><h1>GXLF · Flowable 实验操作台</h1><p>BPMN 执行 · 种子源 ×3 · 二倍频 ×1 · Tango 分系统适配</p></header>
<main><section><button id="start">新建并启动实验</button><input id="run" placeholder="运行编号"><button id="load">查看实验</button><button id="interlock">触发联锁</button><button id="reset">批准补偿</button><p id="status">尚未选择实验</p><p id="error" role="alert"></p><small>“模拟成功”由分系统仿真器生成证据。Flowable 自动推进 BPMN；不会把已接收命令当作已完成。审批补偿后仍需逐个确认复位结果。</small></section>
<section><h2>设备任务</h2><div class="scroll"><table><thead><tr><th>节点</th><th>实例</th><th>动作</th><th>任务状态</th><th>仿真反馈</th><th>错误</th></tr></thead><tbody id="commands"></tbody></table></div></section>
<section><h2>流程等待与人工处理</h2><pre id="active"></pre></section><section><h2>Flowable 执行历史</h2><details><summary>查看持久化活动历史</summary><pre id="history"></pre></details></section></main>
<script>
const $=s=>document.getElementById(s);let run=localStorage.getItem('flowableRun')||'',busy=false; $('run').value=run;
function text(tag,value){const e=document.createElement(tag);e.textContent=value;return e;}
async function api(path,data){const r=await fetch(path,data?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}:{});const value=await r.json();if(!r.ok)throw Error(value.error||r.status);return value;}
async function refresh(){if(!run)return;const s=await api('/api/runs/'+encodeURIComponent(run));$('status').textContent='实验 '+s.ID+' · '+s.OUTCOME;$('commands').replaceChildren();for(const c of s.commands){const tr=document.createElement('tr');tr.append(text('td',c.NODE_ID),text('td',c.DEVICE_ID),text('td',c.ACTION),text('td',c.STATUS));const ops=document.createElement('td');if(c.STATUS==='SENT')for(const [outcome,label] of [['success','模拟成功'],['failure','模拟失败'],['communication_error','通信故障']]){const b=text('button',label);b.disabled=busy;b.onclick=()=>act(()=>api('/api/runs/'+run+'/commands/'+c.ID+'/simulate',{outcome}));ops.append(b);}tr.append(ops,text('td',c.ERROR||''));$('commands').append(tr);}$('active').textContent=JSON.stringify({等待活动:s.activeActivities,人工任务:s.userTasks},null,2);$('history').textContent=JSON.stringify(s.history,null,2);$('reset').disabled=busy||s.userTasks.length===0;$('interlock').disabled=busy||s.activeActivities.length===0;}
async function act(fn){if(busy)return;busy=true;$('error').textContent='';try{await fn();await refresh();}catch(e){$('error').textContent=e.message;}finally{busy=false;}}
$('start').onclick=()=>act(async()=>{const id='run-'+crypto.randomUUID();await api('/api/runs',{requestId:id});run=id;localStorage.setItem('flowableRun',run);$('run').value=run;});
$('load').onclick=()=>act(async()=>{run=$('run').value.trim();});$('interlock').onclick=()=>act(()=>api('/api/runs/'+run+'/interlock',{}));$('reset').onclick=()=>act(()=>api('/api/runs/'+run+'/compensate',{}));
setInterval(()=>{if(!busy)refresh().catch(e=>$('error').textContent=e.message);},700);refresh().catch(e=>$('error').textContent=e.message);
</script></html>
