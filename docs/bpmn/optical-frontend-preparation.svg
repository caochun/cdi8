<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="510" viewBox="0 0 2940 940" role="img" aria-labelledby="title desc">
<title id="title">种子源至多程放大前期准备流程</title>
<desc id="desc">参数下发与安全确认后，出光和同步预放唤醒并行；两者完成后，粗闭环及第一次精闭环与多程光路准直并行。本段结束保持供光与唤醒。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#435b70"/></marker></defs>
<style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif;fill:#243e52;font-size:21px}.title{font-size:35px;font-weight:600}.note{font-size:23px}.edge{fill:none;stroke:#435b70;stroke-width:3;marker-end:url(#arrow)}.task{fill:#fff;stroke:#327a8b;stroke-width:3}.external{fill:#fff7df;stroke:#b58933;stroke-width:3}.gate{fill:#e5f2f4;stroke:#327a8b;stroke-width:3}</style>
<rect width="2940" height="940" fill="#f5f8fb"/>
<text class="title" x="60" y="60">种子源至多程放大：前期准备流程</text>
<polyline class="edge" points="81,360.0 130,360.0"/>
<polyline class="edge" points="310,360.0 365,360.0"/>
<polyline class="edge" points="545,360.0 600,360.0"/>
<polyline class="edge" points="780,360.0 835,360.0"/>
