<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>GXLF 实验场景建模</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; height: 100vh; display: flex; flex-direction: column; background: #1a1a2e; color: #eee; }
    header { padding: 10px 20px; background: #16213e; display: flex; align-items: center; gap: 16px; border-bottom: 1px solid #0f3460; }
    header h1 { font-size: 16px; font-weight: 600; }
    .file-list { display: flex; gap: 8px; margin-left: 20px; }
    .file-btn { padding: 6px 14px; border: 1px solid #0f3460; border-radius: 4px; background: transparent; color: #a8b2d1; cursor: pointer; font-size: 13px; transition: all 0.2s; }
    .file-btn:hover { background: #0f3460; color: #fff; }
    .file-btn.active { background: #e94560; border-color: #e94560; color: #fff; }
    .toolbar { padding: 8px 20px; background: #16213e; display: flex; gap: 8px; border-bottom: 1px solid #0f3460; }
    .toolbar button { padding: 5px 12px; border: 1px solid #0f3460; border-radius: 4px; background: transparent; color: #a8b2d1; cursor: pointer; font-size: 12px; }
    .toolbar button:hover { background: #0f3460; color: #fff; }
    .toolbar .status { margin-left: auto; font-size: 12px; color: #666; line-height: 28px; }
    #editor-frame { flex: 1; border: none; width: 100%; }
    .empty-state { flex: 1; display: flex; align-items: center; justify-content: center; color: #666; font-size: 14px; }
  </style>
</head>
<body>
  <header>
    <h1>GXLF 实验场景建模</h1>
    <div class="file-list" id="fileList"></div>
  </header>
  <div class="toolbar">
    <button onclick="exportXml()">导出 XML</button>
    <button onclick="exportPng()">导出 PNG</button>
    <button onclick="exportSvg()">导出 SVG</button>
    <span class="status" id="status">选择文件开始编辑</span>
  </div>
  <iframe id="editor-frame" style="display:none;"></iframe>
  <div class="empty-state" id="emptyState">点击上方文件名打开编辑</div>

  <script>
    const DRAWIO_URL = 'https://embed.diagrams.net';
    const FILES = [
      { name: '靶场物理布局', file: '靶场物理布局.drawio' },
      { name: '激光光路全链路', file: '激光光路全链路.drawio' }
    ];
    const LIBS = [
      { name: 'GXLF 诊断设备', file: 'libs/GXLF-诊断设备.xml' },
      { name: 'GXLF 激光光路分系统', file: 'libs/GXLF-激光光路分系统.xml' },
      { name: 'GXLF 基础设施与控制', file: 'libs/GXLF-基础设施与控制.xml' }
    ];

    let currentFile = null;
    let currentXml = null;
    let editorReady = false;
    let libsXml = {};

    const fileList = document.getElementById('fileList');
    const frame = document.getElementById('editor-frame');
    const emptyState = document.getElementById('emptyState');
    const status = document.getElementById('status');

    FILES.forEach((f, i) => {
      const btn = document.createElement('button');
      btn.className = 'file-btn';
      btn.textContent = f.name;
      btn.dataset.index = i;
      btn.onclick = () => loadFile(i);
      fileList.appendChild(btn);
    });

    function loadFile(index) {
      const f = FILES[index];
      document.querySelectorAll('.file-btn').forEach(b => b.classList.remove('active'));
      document.querySelector(`.file-btn[data-index="${index}"]`).classList.add('active');
      status.textContent = `加载 ${f.name}...`;

      fetch(f.file)
        .then(r => r.text())
        .then(xml => {
          currentFile = f;
          currentXml = xml;
          startEditor(xml);
        })
        .catch(err => {
          status.textContent = `加载失败: ${err.message}`;
        });
    }

    function startEditor(xml) {
      editorReady = false;
      emptyState.style.display = 'none';
      frame.style.display = 'block';
      frame.src = DRAWIO_URL + '?embed=1&proto=json&spin=1&libraries=1&configure=1';
    }

    window.addEventListener('message', function(evt) {
      if (!evt.data) return;
      let msg;
      try { msg = JSON.parse(evt.data); } catch(e) { return; }

      if (msg.event === 'configure') {
        Promise.all(LIBS.map(lib =>
          fetch(lib.file).then(r => r.text()).then(xml => { libsXml[lib.name] = xml; })
        )).then(() => {
          frame.contentWindow.postMessage(JSON.stringify({
            action: 'configure',
            config: {
              defaultFonts: ["Microsoft YaHei", "SimHei", "sans-serif"],
              defaultLibraries: "",
              enabledLibraries: []
            }
          }), '*');
        });
      }
      else if (msg.event === 'init') {
        editorReady = true;
        frame.contentWindow.postMessage(JSON.stringify({
          action: 'load',
          xml: currentXml,
          autosave: 1,
          libs: Object.entries(libsXml).map(([title, xml]) => {
            const match = xml.match(/<mxlibrary[^>]*>(\[[\s\S]*?\])<\/mxlibrary>/);
            return { title, data: match ? JSON.parse(match[1]) : [] };
          })
        }), '*');
        status.textContent = `编辑中: ${currentFile.name}`;
      }
      else if (msg.event === 'autosave' || msg.event === 'save') {
        currentXml = msg.xml;
        saveToServer(currentFile.file, msg.xml);
      }
      else if (msg.event === 'export') {
        const a = document.createElement('a');
        if (msg.format === 'png' || msg.format === 'svg') {
          a.href = 'data:image/' + msg.format + ';base64,' + msg.data;
          a.download = currentFile.name + '.' + msg.format;
        } else {
          a.href = 'data:application/xml;charset=utf-8,' + encodeURIComponent(msg.xml);
          a.download = currentFile.file;
        }
        a.click();
        status.textContent = `已导出 ${msg.format.toUpperCase()}`;
      }
    });

    function saveToServer(filename, xml) {
      fetch('/save', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ filename, xml })
      }).then(r => {
        if (r.ok) status.textContent = `已保存: ${currentFile.name}`;
        else status.textContent = `保存失败`;
      }).catch(() => {
        status.textContent = `自动保存不可用（需启动 server.py）`;
      });
    }

    function exportXml() {
      if (!currentXml) return;
      const a = document.createElement('a');
      a.href = 'data:application/xml;charset=utf-8,' + encodeURIComponent(currentXml);
      a.download = currentFile.file;
      a.click();
    }

    function exportPng() {
      if (!editorReady) return;
      frame.contentWindow.postMessage(JSON.stringify({
        action: 'export', format: 'png', scale: 2, background: '#ffffff'
      }), '*');
    }

    function exportSvg() {
      if (!editorReady) return;
      frame.contentWindow.postMessage(JSON.stringify({
        action: 'export', format: 'svg'
      }), '*');
    }
  </script>
</body>
</html>
