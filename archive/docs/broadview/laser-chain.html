function showDetail(modId) {
  const d = subsysData[modId];
  if (!d) return;
  document.getElementById('panelTitle').textContent = d.name;
  const statusColor = { Ready: '#4caf50', 'In Progress': '#ff9800', Fault: '#f44336', Offline: '#666', Locked: '#f44336' }[d.status] || '#888';
  document.getElementById('panelInfo').innerHTML = `
    <div class="info-row"><span class="label">英文</span><span class="value">${d.nameEn}</span></div>
    <div class="info-row"><span class="label">Tango Path</span><span class="value" style="color:#00ced1">${d.tango}</span></div>
    <div class="info-row"><span class="label">实例</span><span class="value">${d.instances}</span></div>
    <div class="info-row"><span class="label">位置</span><span class="value">${d.location}</span></div>
    <div class="info-row"><span class="label">状态</span><span class="value" style="color:${statusColor}">${d.status}</span></div>
    <div style="margin-top:8px;color:#aaa;font-size:11px;line-height:1.5">${d.desc}</div>
  `;
  document.getElementById('panelCmds').innerHTML = d.cmds.map(c => {
    const phaseClass = c.phase.includes('A') ? 'phase-a' : c.phase.includes('B') ? 'phase-b' : c.phase.includes('C') ? 'phase-c' : '';
    return `<div class="cmd-item ${phaseClass}">
      <div class="cmd-name">${c.name}</div>
      <div class="cmd-phase">阶段: ${c.phase} — ${c.desc}</div>
    </div>`;
  }).join('');
  document.getElementById('panelParams').innerHTML = d.params.map(p => `
    <div class="param-item">
      <div class="param-led ${p.led}"></div>
      <div class="param-name">${p.name}</div>
      <div class="param-val">${p.val}</div>
    </div>
  `).join('');
  document.getElementById('detailPanel').classList.add('open');
}

function closePanel() { document.getElementById('detailPanel').classList.remove('open'); }
document.addEventListener('keydown', e => { if (e.key === 'Escape') closePanel(); });
