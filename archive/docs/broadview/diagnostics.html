/* Top status bar */

/* Main layout */
.main { display: flex; flex: 1; overflow: hidden; }
.svg-container { flex: 1; overflow: auto; position: relative; }
.detail-panel { width: 340px; background: #1e1e22; border-left: 1px solid #444; overflow-y: auto; display: none; flex-shrink: 0; }

/* SVG styles */
svg text { font-family: 'Consolas', 'Monaco', 'Courier New', monospace; }

/* Panel header */

.panel-header { background: #252528; padding: 8px 12px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
.panel-header h3 { font-size: 13px; font-weight: bold; color: #00ced1; }
.panel-close { cursor: pointer; color: #888; font-size: 16px; }
.panel-close:hover { color: #fff; }

/* Unit list */
.unit-list { padding: 8px 12px; }
.unit-item { display: flex; align-items: center; padding: 6px 0; border-bottom: 1px solid #2a2a2e; }
.unit-item:last-child { border-bottom: none; }
.unit-icon { width: 24px; height: 24px; margin-right: 8px; display: flex; align-items: center; justify-content: center; border-radius: 3px; font-size: 10px; font-weight: bold; flex-shrink: 0; }
.unit-icon.osc { background: #1565c0; color: #fff; }
.unit-icon.cam { background: #6a1b9a; color: #fff; }
.unit-icon.hv { background: #e65100; color: #fff; }
.unit-icon.mot { background: #2e7d32; color: #fff; }
.unit-icon.spec { background: #00838f; color: #fff; }
.unit-icon.sync { background: #4527a0; color: #fff; }
.unit-icon.cal { background: #795548; color: #fff; }
.unit-icon.dim { background: #37474f; color: #fff; }
.unit-icon.vac { background: #455a64; color: #fff; }
.unit-info { flex: 1; }
.unit-name { font-size: 11px; color: #ccc; }
.unit-params { font-size: 10px; color: #888; margin-top: 2px; }
.unit-status { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; margin-left: 8px; }
.unit-status.ready { background: #4caf50; }
.unit-status.warning { background: #ff9800; }
.unit-status.fault { background: #f44336; }
.unit-status.offline { background: #666; }

/* Module info in panel */
.module-info { padding: 8px 12px; }
.module-info .row { display: flex; justify-content: space-between; padding: 3px 0; font-size: 11px; }
.module-info .label { color: #888; }
.module-info .value { color: #e0e0e0; }
.module-info .purpose { color: #00ced1; font-style: italic; margin-top: 4px; font-size: 11px; }

/* Bottom bar */
.bottom-bar { background: #1a1a1e; border-top: 1px solid #444; padding: 4px 12px; display: flex; gap: 16px; align-items: center; height: 24px; flex-shrink: 0; font-size: 11px; color: #888; }

/* Legend */
.legend { display: flex; gap: 16px; align-items: center; }
.legend-item { display: flex; align-items: center; gap: 4px; }
.legend-dot { width: 10px; height: 10px; border-radius: 2px; }
.legend-dot.ready { background: #4caf50; }
.legend-dot.warning { background: #ff9800; }
.legend-dot.fault { background: #f44336; }

function showDetail(moduleId) {
  const m = moduleData[moduleId];
  if (!m) return;
  document.getElementById('panelTitle').textContent = m.name;
  const statusColor = m.status === 'Ready' ? '#4caf50' : m.status === 'Fault' ? '#f44336' : m.status === 'InProgress' ? '#ff9800' : '#666';
  document.getElementById('moduleInfo').innerHTML = `
    <div class="row"><span class="label">英文名</span><span class="value">${m.nameEn}</span></div>
    <div class="row"><span class="label">模块数量</span><span class="value">×${m.count}</span></div>
    <div class="row"><span class="label">安装位置</span><span class="value">${m.location}</span></div>
    <div class="row"><span class="label">状态</span><span class="value" style="color:${statusColor}">${m.status}</span></div>
    <div class="purpose">诊断目的：${m.purpose}</div>
  `;
  document.getElementById('unitList').innerHTML = m.units.map(u => `
    <div class="unit-item">
      <div class="unit-icon ${u.type}">${u.icon}</div>
      <div class="unit-info">
        <div class="unit-name">${u.name}</div>
        <div class="unit-params">${u.params}</div>
      </div>
      <div class="unit-status ${u.status}"></div>
    </div>
  `).join('');
  document.getElementById('detailPanel').classList.add('open');
}

function closePanel() {
  document.getElementById('detailPanel').classList.remove('open');
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') closePanel(); });
