      strategy: abort
      notify: [总控操作员]
    on_failure:
      strategy: emergency
      action: { command: EmergencyDischarge, target: 泵浦分系统 }
    operator_intervention:
      allowed_actions: [pause, abort]
      default_action: abort
      confirm_required: true
    safety_critical: true
    description: >
      与同步同时接收指令, 在同步倒计时第三秒时完成触发准备。
      依据束线编号识别需要控制的系统服务。

