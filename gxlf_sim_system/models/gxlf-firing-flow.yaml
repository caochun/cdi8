  # -- 6.22 发射准备全部完成 ------------------------------------------------
  # [修正C1] readiness 补充"打靶运动准备"
  # ↓↓↓ join 类型示例: 纯汇合点, 不下发指令, 等所有 depends 完成 ↓↓↓
  发射准备全部完成:
    id: N22
    type: join                       # join=AND 汇合点, 所有 depends 完成才放行
    stage: 发射准备
    safety_scope: under_interlock
    dependency_policy: all_success   # 所有前置必须成功(join 的核心语义)
    command: null                    # join 不下发指令, 显式声明 null
    depends:                         # 汇合的所有分支(缺一不可)
      - 能量精闭环_1
      - 诊断设备发射准备
      - 靶瞄进入打靶状态
      - 测量打靶运动准备
      - 打靶运动准备
      - 光纤种子源出光
      - 泵浦发射准备
    runtime_guards:
      - { check: 各系统服务运行状态正常 }
      - { interlock: safety, check: normal }
      - { check: 泵浦发射准备状态正常 }
    guard_failure_policy:
      strategy: pause
      notify: [总控操作员]
    on_failure:
      strategy: pause
    operator_intervention:
      allowed_actions: [continue, pause, abort]
      default_action: continue
      confirm_required: true
    description: >
      AND汇合点, 不下发控制指令。所有准备链路完成后通过。
      readiness: 诊断设备发射准备完成、测量进入打靶运动准备、靶瞄进入打靶状态、
      多程放大系统光路准直完成(隐含于光束引导->靶瞄打靶状态链路)、种子源或二倍频出光、
      再生与双程放大唤醒及能量闭环完成、各系统服务运行状态正常、安全联锁状态正常、
      泵浦发射准备状态正常。

