      on_max_retries: skip
    description: 根据束线编号调用对应再生与双程放大系统服务。

  # -- 6.41 预放待机 --------------------------------------------------------
  预放待机:
    id: N41
    type: action
    stage: 发射后处理
    safety_scope: under_interlock
    dependency_policy: all_success
    target:
      system: [再生与双程放大组件]
      fan_out: by_beam_group
      completion: all_success
    command: PreampStandby
    call_mode: async
    timeout: 10s
    input:
      - { name: 发次编号, type: string }
      - { name: 阶段编号, type: string }
      - { name: 束线编号, type: string }
    output:
