    operator_intervention:
      allowed_actions: [pause, abort]
      default_action: abort
      confirm_required: true
    safety_critical: true
    description: >
      与同步同时接收指令, 在同步倒计时第三秒时完成触发准备。

  # -- 6.37 正式发射完成 ----------------------------------------------------
  正式发射完成:
    id: N37
    type: join
    stage: 正式发射
    safety_scope: under_interlock
    dependency_policy: all_success
    command: null
    depends: [主发射同步触发, 主发射泵浦触发准备, 主发射开关触发准备]
    runtime_guards:
      - { check: 泵浦触发结果正常 }
    guard_failure_policy:
      strategy: abort
      notify: [总控操作员]
    on_failure:
      strategy: emergency
      action: { command: EmergencyDischarge, target: 泵浦分系统 }
    description: >
      正式触发后的汇合判断点。
      [待确认] 最终完成判据是集中同步返回总体成功状态, 还是需要泵浦触发结果作为独立判据。

  # ========================================================================
  # 节点定义 -- 发射后处理阶段 (N38-N59)
  # ========================================================================

