    safety_critical: true
    hold_constraint:
      max_hold_time: 5min            # [待确认] 原值60s导致仿真中并行依赖链(打靶测量准备~72s)超时abort；改为5min待业务方确认实际安全界限
      on_hold_exceeded: switch_standby

  # -- 6.32 警灯/警示音乐开启 ----------------------------------------------
  # [注释A6] 链路清单5.2#4写depends为发射充电准备, card写前置条件为"发射充电开始"。
  # 此处按链路清单取depends=发射充电准备, 两者有歧义待业务方确认。
  警灯警示音乐开启:
    id: N32
    type: action
    stage: 正式发射
    safety_scope: under_interlock
    dependency_policy: all_success
    target:
      system: [控制环境组件]
      fan_out: broadcast
      completion: all_success
    command: WarningLightAndMusic
    call_mode: async
    timeout: 1s
    input:
      - { name: 发次编号, type: string }
      - { name: 阶段编号, type: string }
      - { name: 流程任务编号, type: string }
      - { name: 节点编号, type: string }
    output:
      接收状态: { type: enum, values: [0, 1, 2] }
    completion_criteria:
      success_condition: "output.接收状态 == 1"
    depends: [发射充电准备]
    runtime_guards:
      - { service: 控制环境组件, check: running }
      - { interlock: safety, check: normal }
    guard_failure_policy:
      strategy: pause
      notify: [总控操作员]
    on_failure:
      strategy: retry
      max_retries: 3
      retry_interval: 1s
      on_max_retries: pause
    operator_intervention:
      allowed_actions: [continue, pause, abort]
      default_action: continue
      confirm_required: false
    linked_behavior:                 # ── 关联行为(跨节点联动, 解释器需处理) ──
      music_auto_stop:               # 音乐自动停止规则
        trigger: { node: 发射充电, event: completed }  # 触发条件: 发射充电完成时
        action: stop_music           # 动作: 停止音乐播放
      warning_light:                 # 警灯持续规则
        keep_active_until: [警灯关闭]  # 警灯保持到"警灯关闭"节点执行
    description: >
      泵浦充电开始, 打开警灯、音响, 并播放提前设定音乐。
      充电结束音乐停止, 警灯继续警示。

  # -- 6.33 发射充电 --------------------------------------------------------
  # ↓↓↓ 安全关键节点示例: safety_critical + hold_constraint + timing ↓↓↓
  发射充电:
    id: N33
    type: action
    stage: 正式发射
    safety_scope: under_interlock
    dependency_policy: all_success
    target:
      system: [泵浦分系统]
      fan_out: broadcast
      completion: all_success
    command: PumpCharge
    call_mode: async
    timing:                          # ── 精确时间约束(安全关键节点专用) ──
      expected_duration: 75s         # 预期执行时长
      tolerance: 3s                  # 允许偏差(75±3s)
      hard_deadline: true            # true=超时即触发紧急处理, 不等重试
    input:
      - { name: 发次编号, type: string }
      - { name: 阶段编号, type: string }
      - { name: 流程任务编号, type: string }
      - { name: 节点编号, type: string }
      - { name: 束线编号, type: string }
      - { name: 发射充电指令标识, type: enum, values: [主, 预] }
    output:
      接收状态: { type: enum, values: [0, 1, 2] }
    completion_criteria:
      success_condition: "output.接收状态 == 1"
    depends: [诊断设备采集设置, 晶体位姿设置, 发射充电准备, 能量计清零, 打靶测量准备, 开关充电]
    runtime_guards:
      - { service: 泵浦分系统, check: running }
      - { interlock: safety, check: normal }
    guard_failure_policy:
      strategy: abort                # 充电前守卫失败直接中止(不暂停等待)
      notify: [总控操作员]
    on_failure:
      strategy: emergency            # emergency=触发紧急处理动作
      action: { command: EmergencyStopCharge, target: 泵浦分系统 }  # 紧急停充
    safety_critical: true            # ── 标记为安全关键节点 ──
    hold_constraint:                 # ── 完成后保持时间约束(充电态不可久持) ──
      max_hold_time: 30s             # [待确认] 30s数值无文档来源, 需业务方确认
      on_hold_exceeded: emergency_discharge  # 超时则紧急泄放
    description: >
      泵浦充电完成无法长时间保持, 且具有安全风险。执行时长75s+-3s。

  # -- 6.34 主发射同步触发 -------------------------------------------------------
  主发射同步触发:
    id: N34
    type: action
    stage: 正式发射
    safety_scope: under_interlock
    dependency_policy: all_success
    target:
      system: [集中同步分系统]
      fan_out: by_beam_line
      completion: all_success
    command: SyncTrigger
    call_mode: async
    timeout: 10s
    input:
      - { name: 发次编号, type: string }
      - { name: 阶段编号, type: string }
      - { name: 流程任务编号, type: string }
      - { name: 节点编号, type: string }
      - { name: 束线编号, type: string }
    output:
      接收状态: { type: enum, values: [0, 1, 2] }
    completion_criteria:
      success_condition: "output.接收状态 == 1"
      allow_partial: false
    depends: [发射充电, 警灯警示音乐开启]
    runtime_guards:
      - { node: 发射充电, check: completed }
      - { check: 警示音乐停止 }
      - { node: 开关充电, check: completed }
      - { interlock: safety, check: normal }
    guard_failure_policy:
      strategy: abort
      notify: [总控操作员]
    on_failure:
      strategy: emergency
      action: { command: EmergencyTrigger, target: 集中同步分系统 }
    operator_intervention:
      allowed_actions: [pause, abort]
      default_action: abort
      confirm_required: true
    safety_critical: true
    description: >
      同步系统接收触发指令后, 控制音响装置进行倒计时5秒, 在第五秒完成触发。
      依据束线编号识别需要控制的系统服务。

