    call_mode: async
    timeout: 10min
    input:
      - { name: 发次编号, type: string }
      - { name: 阶段编号, type: string }
    output:
      接收状态: { type: enum, values: [0, 1, 2] }
    completion_criteria:
      success_condition: "output.接收状态 == 1"
      allow_partial: true
    depends: [正式发射完成]
    runtime_guards:
      - { node: 主发射同步触发, check: completed }
      - { service: 物理实验诊断分系统, check: running }
    guard_failure_policy:
      strategy: pause
      notify: [总控操作员]
    on_failure:
      strategy: retry
      max_retries: 2
      on_max_retries: skip
    description: 数据采集入库, 高压电源退电、DIM的复位。

  # -- 6.39 种子源/二倍频激光参数采集 ----------------------------------------
  种子源二倍频参数采集:
