kind: SequentialExperiment
version: "1.0"
id: seed_source_experiment
name: 光纤种子源最小实验
system_id: laser_seed_source
source:
  workbook: 20260928集中管控系统与分系统关键状态梳理清单.xlsx
  sheet: 分系统关键状态表
  note: 根据第 3–8、10 行动作及前置条件编排的单分系统仿真流程，不代表完整发射实验。
# 顺序即依赖；只有当前节点成功，才允许下发下一节点。
nodes:
  - {id: self_test, action: power_on_self_test, phase: 准备}
  - {id: check, action: function_check, phase: 准备}
  - {id: configure, action: parameter_dispatch, phase: 准备}
  - {id: emit, action: seed_source_emit, phase: 出光}
  - {id: collect, action: laser_parameter_collect, phase: 采集}
  - {id: standby, action: standby_reset, phase: 收尾}
  - {id: shutdown, action: shutdown, phase: 收尾}
