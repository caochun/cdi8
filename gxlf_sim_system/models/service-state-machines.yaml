kind: GXLFServiceStateMachineModel
version: "0.2"
status: draft_for_review
language: zh-CN
source:
  flow_definition: "./gxlf-firing-flow.yaml"
  requirements_doc: "../../流程需求.docx"
  design_date: "2026-06-03"
  design_scope:
    - "Tango 系统服务实例命名规则"
    - "Tango 系统服务类型状态机模板"
    - "command 到 state transition 的映射"
    - "异常状态与人工暂停口径"
  architecture_boundary:
    interaction_chain:
      - "集中管控系统通过 Tango 向系统服务实例下发 command。"
      - "系统服务实例接收 command，并由系统服务自行控制其背后的真实物理设备。"
      - "系统服务实例通过集中管控系统注册的状态返回接口反馈执行状态、服务健康状态和对外业务状态。"
      - "集中管控系统根据状态返回更新流程节点状态、服务状态仓库和 pending 人工决策。"
    in_scope:
      - "Tango 系统服务实例的唯一标识、命名和 fan-out 选择规则。"
      - "系统服务实例对集中管控暴露的健康状态、任务状态和业务状态。"
      - "系统服务实例 command 的接收态、执行态、完成态和异常态。"
    out_of_scope:
      - "系统服务到真实物理设备之间的驱动、采样、闭环控制和内部故障诊断逻辑。"
      - "真实物理设备内部状态机。"
  confirmed_overrides:
    - "以 flow/gxlf-firing-flow.yaml 和用户确认口径为准；需求文档中冲突的服务数量或节点口径不直接采用。"
    - "所有 fan-out 调用均要求 all_success；不允许因部分服务成功而判定节点完成。"
    - "暂停后不设置系统自动倒计时，由人工决策继续、重试、跳过或终止。"
    - "N18 为进入打靶状态，对接多程放大组件 10 路，按 beam_group 扇出。"
    - "N19 为打靶运动准备，业务指令为测量打靶运动准备，对接测量取样组件 60 路，按 beam_line 扇出。"
    - "光路准直依赖能量粗闭环；片放吹扫 timeout 为 2s。"

naming_rules:
  service_id_pattern: "{domain}.{system_code}.{instance_code}"
  tango_fqdn_pattern: "{domain}/{system_code}/{instance_code}"
  domain: gxlf
  command_method_rule:
    tango_method: "使用接口契约表中的英文 command 名称，例如 MeasShotMotionReady。"
    business_instruction: "保留中文业务指令名称，用于 UI、日志、审批和客户确认。"
    note: "后续真实 Tango 系统服务如已有既定英文 API 名，可在 interface-contracts.yaml 的 adapter_method 中覆盖。"
  instance_code_rules:
    broadcast:
      instance_count_rule: "单实例系统使用 svc01；多目标 broadcast 由流程节点显式列出多个系统。"
      instance_code_pattern: "svc{NN}"
      examples: ["svc01"]
    by_beam_line:
      instance_count_rule: "60 路束线服务，每一路对应一个 Tango 系统服务实例。"
      instance_code_pattern: "bl{01..60}"
      fan_out_key: beam_line_no
      examples: ["bl01", "bl30", "bl60"]
    by_beam_group:
      instance_count_rule: "10 路束组服务，每个系统服务实例管 6 束；真实设备映射由系统服务内部负责。"
      instance_code_pattern: "bg{01..10}"
      fan_out_key: beam_group_no
      examples: ["bg01", "bg05", "bg10"]
  beam_group_mapping:
    - { beam_group_no: 1, instance_code: bg01, beam_lines: [1, 2, 3, 4, 5, 6] }
    - { beam_group_no: 2, instance_code: bg02, beam_lines: [7, 8, 9, 10, 11, 12] }
    - { beam_group_no: 3, instance_code: bg03, beam_lines: [13, 14, 15, 16, 17, 18] }
    - { beam_group_no: 4, instance_code: bg04, beam_lines: [19, 20, 21, 22, 23, 24] }
    - { beam_group_no: 5, instance_code: bg05, beam_lines: [25, 26, 27, 28, 29, 30] }
    - { beam_group_no: 6, instance_code: bg06, beam_lines: [31, 32, 33, 34, 35, 36] }
    - { beam_group_no: 7, instance_code: bg07, beam_lines: [37, 38, 39, 40, 41, 42] }
    - { beam_group_no: 8, instance_code: bg08, beam_lines: [43, 44, 45, 46, 47, 48] }
    - { beam_group_no: 9, instance_code: bg09, beam_lines: [49, 50, 51, 52, 53, 54] }
    - { beam_group_no: 10, instance_code: bg10, beam_lines: [55, 56, 57, 58, 59, 60] }

system_instance_catalog:
  光纤种子源组件:
    system_code: seed_source
