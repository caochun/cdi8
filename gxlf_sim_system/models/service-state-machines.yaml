    selector: broadcast
    instances: 1
    service_ids: ["gxlf.seed_source.svc01"]
  二倍频宽带激光注入组件:
    system_code: shg_injector
    protocol: tango
    selector: broadcast
    instances: 1
    service_ids: ["gxlf.shg_injector.svc01"]
  再生与双程放大组件:
    system_code: preamp
    protocol: tango
    selector: by_beam_group
    instances: 10
    service_id_pattern: "gxlf.preamp.bg{01..10}"
  多程放大组件:
    system_code: multipass_amp
    protocol: tango
    selector: by_beam_group
    instances: 10
    service_id_pattern: "gxlf.multipass_amp.bg{01..10}"
  泵浦分系统:
    system_code: pump
    protocol: tango
