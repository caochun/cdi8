kind: JointFanoutSequentialExperiment
version: '1.0'
id: laser_joint_fanout_experiment
name: 激光链路种子源扇出与二倍频联合准备
source:
  workbook: 20260928集中管控系统与分系统关键状态梳理清单.xlsx
  rows: 3-24
  note: 第 4 步组合模型；种子源实例数量是仿真配置，不是 Excel 的数量声明。
systems:
  seed_source:
    model_id: laser_seed_source
    mode: fanout
    instances: [seed_01, seed_02, seed_03]
  shg_injector:
    model_id: shg_injector
    mode: single
    instance: shg_01
aggregation: all_success
nodes:
  - {id: seed_self_test, target: seed_source, action: power_on_self_test, phase: 准备}
  - {id: shg_self_test, target: shg_injector, action: power_on_self_test, phase: 准备}
  - {id: seed_check, target: seed_source, action: function_check, phase: 准备}
  - {id: shg_check, target: shg_injector, action: function_check, phase: 准备}
  - {id: seed_configure, target: seed_source, action: parameter_dispatch, phase: 参数准备}
  - {id: shg_configure, target: shg_injector, action: parameter_dispatch, phase: 参数准备}
  - id: laser_ready_gate
    type: gate
    phase: 联合门禁
    requires:
      seed_source:
        mode: all
        main_state: 正常
        current_state: 参数下发完成
        business_state: 就绪
      shg_injector:
        mode: one
        main_state: 正常
        current_state: 参数下发完成
        business_state: 就绪
  - {id: seed_emit, target: seed_source, action: seed_source_emit, phase: 出光}
  - {id: shg_emit, target: shg_injector, action: frequency_doubled_emit, phase: 出光}
