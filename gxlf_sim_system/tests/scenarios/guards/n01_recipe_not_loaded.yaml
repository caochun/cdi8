id: n01_recipe_not_loaded
title: N01 配方未加载时等待，恢复后继续
suite: model_scenario
initial_context:
  flags:
    recipe_loaded: false
    central_control_healthy: true
run:
  max_nodes: 1
expect_before_update:
  waiting_nodes:
    - N01
  completed_nodes: []
  commands_dispatched: 0
  engine_events:
    includes:
      - node_guard_blocked
then:
  update_context:
    flags:
      recipe_loaded: true
expect:
  flow_status: completed
  completed_nodes:
    - N01
  failed_nodes: []
  waiting_nodes: []
  engine_events:
    includes:
      - node_guard_passed
      - node_started
      - node_completed
