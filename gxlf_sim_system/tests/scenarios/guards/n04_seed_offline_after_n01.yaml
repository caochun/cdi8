id: n04_seed_offline_after_n01
title: N01 完成后光纤种子源 offline，N04 guard 等待且不下发
suite: model_scenario
initial_context:
  interlocks:
    safety: abnormal
run:
  async: true
expect_before_action:
  completed_nodes:
    - N01
  waiting_nodes:
    - N04
then:
  set_service_health:
    system_name: 光纤种子源组件
    health_state: offline
  update_context:
    interlocks:
      safety: normal
expect_before_stop:
  waiting_nodes:
    - N04
  engine_events:
    includes:
      - node_guard_blocked
then_after_expectation:
  stop: true
expect:
  flow_status: aborted
  failed_nodes: []
  commands_dispatched_for:
    N04: 0
