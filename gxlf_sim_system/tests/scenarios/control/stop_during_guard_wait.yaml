id: stop_during_guard_wait
title: guard 等待时 stop 应中止流程
suite: model_scenario
initial_context:
  flags:
    recipe_loaded: false
run:
  async: true
expect_before_stop:
  waiting_nodes:
    - N01
  engine_events:
    includes:
      - node_guard_blocked
then:
  stop: true
expect:
  flow_status: aborted
  completed_nodes: []
  failed_nodes: []
  commands_dispatched: 0
