[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gxlf-component-simulator"
version = "0.2.0"
description = "SCXML-driven component state-machine simulator"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
tango = ["PyTango>=10,<11"]

[project.scripts]
component-sim = "gxlf_component_simulator.cli:main"
control-tango-bridge = "gxlf_component_simulator.tango.control_bridge:main"

[tool.setuptools.packages.find]
include = ["gxlf_component_simulator*"]

[tool.setuptools.package-data]
gxlf_component_simulator = ["models/*.scxml"]
