[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gxlf-seed-simulator"
version = "0.2.0"
description = "Seed-source hierarchical state-machine simulator"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
tango = ["PyTango>=10,<11"]
gui = ["PyTango>=10,<11", "taurus>=5.4.1,<6", "PyQt6>=6.7,<7"]

[project.scripts]
seed-sim = "gxlf_sim_system.cli:main"
seed-panel = "gxlf_sim_system.gui.app:main"

[tool.setuptools.packages.find]
include = ["gxlf_sim_system*"]
