[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gxlf-component-simulator"
version = "0.2.0"
description = "SCXML-driven component state-machine simulator"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
tango = ["PyTango>=10,<11"]
gui = ["PyTango>=10,<11", "taurus>=5.4.1,<6", "PyQt6>=6.7,<7", "PyQt6-WebEngine>=6.7,<7"]

[project.scripts]
component-sim = "gxlf_sim_system.cli:main"
component-panel = "gxlf_sim_system.gui.app:main"
control-tango-bridge = "gxlf_sim_system.tango.control_bridge:main"

[tool.setuptools.packages.find]
include = ["gxlf_sim_system*"]

[tool.setuptools.package-data]
gxlf_sim_system = ["gui/assets/schviz/*.js", "gui/assets/schviz/*.md", "gui/assets/schviz/LICENSE.*"]
