server:
  address: 127.0.0.1
  port: 8080
spring:
  datasource:
    url: ${CONTROL_DB_URL:jdbc:h2:file:./data/control-v2}
    username: sa
    password: ${CONTROL_DB_PASSWORD:}
flowable:
  database-schema-update: true
  async-executor-activate: true
  history-level: full
control:
  tango-url: ${TANGO_BRIDGE_URL:http://127.0.0.1:8766}
  command-timeout: ${COMMAND_TIMEOUT:PT15M}
  workflow-timeout: ${WORKFLOW_TIMEOUT:PT45M}
logging:
  level:
    org.flowable: WARN
