[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gxlf-subsystem-state-machine"
version = "0.1.0"
description = "Excel-derived GXLF subsystem state-machine simulation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6.0",
]

[tool.setuptools.packages.find]
include = ["gxlf_sim_system*"]

[tool.setuptools.package-data]
gxlf_sim_system = ["models/*.yaml"]
